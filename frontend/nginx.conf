server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/javascript text/css;
  location /api/ { proxy_pass http://api:8000; proxy_read_timeout 60s; proxy_set_header X-Request-Id $request_id; }
  location /health { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
